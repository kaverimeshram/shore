app = "airlock-zec"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "10s"
  grace_period = "90s"
  method = "GET"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
