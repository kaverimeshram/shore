[package]
name = "airlock"
version = "0.1.0"
edition = "2021"

[lib]
name = "airlock"
path = "src/lib.rs"

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
zcash_client_backend = { version = "=0.25.0-pre.0", features = ["orchard", "sync", "pczt", "lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport", "zcash_proofs", "tor"] }
zcash_client_sqlite = { version = "=0.23.0-pre.0", features = ["orchard", "unstable", "transparent-inputs", "serde"] }
zcash_primitives = "=0.31.0-pre.0"
zip321 = "=0.10.0-pre.0"
pczt = { version = "=0.10.0-pre.0", features = ["orchard", "signer", "prover", "tx-extractor", "io-finalizer", "spend-finalizer"] }
countersign-core = { path = "../countersign/crates/countersign-core" }
zcash_keys = { version = "=0.17.0-pre.0", features = ["orchard", "sapling"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_address = "=0.14.0-pre.0"
orchard = "=0.16.0"
zip32 = "=0.3.0"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hyper = "1"
http-body-util = "0.1"
hex = "0.4"
tonic = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = "0.1"
rand_chacha = "0.10"
blake2b_simd = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rand = { version = "0.10", features = ["sys_rng"] }

[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.blake2b_simd]
opt-level = 3
[profile.dev.package.sinsemilla]
opt-level = 3
