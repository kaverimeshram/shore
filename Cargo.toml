[package]
name = "airlock"
version = "0.1.0"
edition = "2021"

[lib]
name = "airlock"
path = "src/lib.rs"

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
zcash_keys = { version = "=0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = "=0.10.6"
zcash_address = "=0.13.0"
orchard = "=0.15.5"
zip32 = "=0.2.1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
rand = "0.8"
